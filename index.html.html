<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queensland Cricket — Pathway Visibility System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#79133E; --maroon-deep:#5E0E30; --navy:#16223C; --gold:#FDB727; --rust:#BB6532;
    --tint:#F4EEF1; --paper:#F3F1EE; --card:#FFFFFF; --ink:#22222A; --ink-soft:#5B5B66;
    --line:#E7E2E5; --green:#2E7D5B; --green-bg:#E4F1EA; --red:#C0392B; --red-bg:#FBE7E5;
    --amber:#C98A16; --amber-bg:#FBF0D8; --blue:#2D5F8A; --blue-bg:#E4EBF2;
    --grey:#9A9AA4; --grey-bg:#EFEEF0;
    --shadow:0 1px 2px rgba(20,15,25,.04),0 6px 18px rgba(20,15,25,.06);
    --font-display:'Barlow Condensed',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1360px;margin:0 auto;padding:20px 22px 100px;}
  h1,h2,h3{font-family:var(--font-display);}
  button,select,input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- Header ---------- */
  .top{background:linear-gradient(120deg,var(--maroon) 0%,var(--maroon-deep) 100%);
    border-radius:18px;padding:22px 28px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .top::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(253,183,39,.18),transparent 70%);}
  .top-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:1;}
  .kicker{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
  .top h1{font-size:34px;font-weight:800;line-height:1.05;margin:4px 0 6px;letter-spacing:.2px;}
  .top .strap{font-size:13.5px;color:rgba(255,255,255,.82);max-width:560px;}
  .top .principle{font-size:12px;color:rgba(255,255,255,.65);margin-top:10px;font-style:italic;}
  .top-meta{display:flex;gap:10px;flex-wrap:wrap;}
  .mchip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:10px;
    padding:8px 14px;text-align:center;min-width:78px;}
  .mchip .n{font-size:20px;font-weight:800;font-family:var(--font-display);}
  .mchip .l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.68);margin-top:1px;}

  /* ---------- Scoreboard ribbon (Role Health, persistent) ---------- */
  .ribbon{margin-top:14px;background:var(--navy);border-radius:14px;padding:10px 14px;
    display:flex;gap:6px;overflow-x:auto;box-shadow:var(--shadow);}
  .rtile{flex:1 1 0;min-width:112px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:8px 10px;}
  .rtile .rt-name{font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rtile .rt-row{display:flex;align-items:center;gap:6px;margin-top:5px;}
  .rt-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .rt-dot.green{background:var(--green);} .rt-dot.amber{background:var(--amber);} .rt-dot.red{background:var(--red);} .rt-dot.grey{background:var(--grey);}
  .rt-count{font-size:11px;color:rgba(255,255,255,.72);}
  .rt-count b{color:var(--gold);font-weight:800;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;align-items:center;}
  .tab{font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:.3px;
    background:#fff;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;
    padding:9px 18px;cursor:pointer;transition:all .12s;}
  .tab:hover{border-color:var(--maroon);color:var(--maroon);}
  .tab.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
  .tab-spacer{flex:1;min-width:8px;}
  .tab.output{background:#fff;color:var(--rust);border:1px dashed var(--rust);}
  .tab.output:hover{border-style:solid;}
  .tab.output.active{background:var(--rust);color:#fff;border-style:solid;}
  .output-lab{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-right:2px;}

  .view{display:none;margin-top:18px;}
  .view.active{display:block;}

  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;}
  .card h2{font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--maroon);
    display:flex;align-items:center;gap:9px;margin-bottom:14px;font-family:var(--font-body);}
  .card h2::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--gold);flex:0 0 auto;}
  .card h2 .sub{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:none;letter-spacing:.2px;}
  .card.output-card{border:1px dashed var(--rust);}

  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:var(--font-body);background:var(--maroon);color:#fff;transition:filter .12s;letter-spacing:.2px;}
  .btn:hover{filter:brightness(1.1);}
  .btn.ghost{background:#fff;color:var(--maroon);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--maroon);}
  .btn.gold{background:var(--gold);color:var(--maroon-deep);}
  .btn.sm{padding:6px 11px;font-size:11px;}

  /* ---------- Pathway / landing ---------- */
  .briefing{background:var(--navy);color:#fff;border-radius:16px;padding:20px 24px;margin-bottom:16px;}
  .briefing .b-kicker{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  .briefing p{font-size:15px;line-height:1.65;color:rgba(255,255,255,.92);}
  .briefing p+p{margin-top:8px;}
  .briefing b{color:var(--gold);}

  .snap-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  @media(max-width:1000px){.snap-strip{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:560px){.snap-strip{grid-template-columns:repeat(2,1fr);}}
  .snap-tile{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fdfdfc;cursor:pointer;transition:border-color .12s;}
  .snap-tile:hover{border-color:var(--maroon);}
  .snap-tile.watch{border-style:dashed;border-color:var(--rust);}
  .snap-tile .st-n{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--maroon);}
  .snap-tile .st-l{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}

  .qlist{display:flex;flex-direction:column;gap:0;}
  .qrow{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px;}
  .qrow:last-child{border-bottom:none;}
  .qrow .qdot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto;}
  .qrow .qtxt b{font-weight:700;}
  .qrow .qmeta{color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .empty-state{text-align:center;padding:22px 10px;color:var(--ink-soft);font-size:13px;}

  .quicklinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}

  /* ---------- Visibility ---------- */
  .vis-toggle{display:inline-flex;background:var(--grey-bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px;}
  .vt-btn{font-family:var(--font-display);font-weight:700;font-size:14px;padding:8px 20px;border:none;border-radius:9px;
    background:transparent;color:var(--ink-soft);cursor:pointer;}
  .vt-btn.active{background:var(--maroon);color:#fff;}

  .squad-col{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fdfdfc;}
  .squad-head{background:var(--navy);color:#fff;padding:10px 14px;font-family:var(--font-display);font-weight:700;font-size:16px;
    display:flex;justify-content:space-between;align-items:center;}
  .squad-head .cnt{background:var(--gold);color:var(--navy);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800;}
  .squad-body{padding:10px 14px;}
  .id-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .id-row:last-child{border-bottom:none;}
  .id-row:hover{background:var(--tint);}
  .id-row .nm{font-weight:700;flex:0 0 auto;min-width:130px;}
  .id-row .tag{background:var(--tint);color:var(--maroon);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;}
  .id-row .club{color:var(--ink-soft);font-size:11.5px;flex:1;}
  .cat-badge{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;border-radius:999px;padding:3px 9px;flex:0 0 auto;}
  .cat-badge.rn{background:var(--green-bg);color:var(--green);} .cat-badge.rs{background:var(--amber-bg);color:var(--amber);}
  .cat-badge.dv{background:var(--blue-bg);color:var(--blue);} .cat-badge.lt{background:var(--grey-bg);color:#6d6d78;}

  .watch-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fdfdfc;}
  .watch-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap;}
  .watch-row:last-child{border-bottom:none;}
  .watch-row .nm{font-weight:700;flex:0 0 auto;min-width:130px;}
  .watch-row .tag{background:var(--tint);color:var(--maroon);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;flex:0 0 auto;}
  .watch-row .note{color:var(--ink-soft);font-style:italic;font-size:12px;flex:1;min-width:160px;}
  .watch-row .wc-actions{display:flex;gap:6px;flex:0 0 auto;}

  .movement-panel{border-top:2px solid var(--line);margin-top:16px;padding-top:14px;}
  .mv-feed{display:flex;flex-direction:column;gap:0;}
  .mv-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .mv-row:last-child{border-bottom:none;}
  .mv-time{font-size:10.5px;color:var(--ink-soft);min-width:112px;}
  .mv-name{font-weight:700;min-width:120px;}
  .mv-detail{color:var(--ink-soft);flex:1;}
  .mv-detail .from{color:var(--grey);} .mv-detail .to{color:var(--maroon);font-weight:700;}

  .add-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .add-form input,.add-form select,.add-form textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;flex:1;min-width:110px;}
  .add-form input:focus,.add-form select:focus,.add-form textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(253,183,39,.25);}

  .hist-controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .hist-controls select{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--maroon);}
  .hist-list{border:1px solid var(--line);border-radius:12px;padding:6px 16px;background:#fdfdfc;}
  .hist-row{padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;}
  .hist-row:last-child{border-bottom:none;}
  .hist-note{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}

  /* ---------- Transition ---------- */
  .gate-head-q{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--navy);margin-bottom:16px;}
  .gate{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .gate-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .gate-name{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--navy);}
  .gate-status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
  .gate-status.strong{background:var(--green-bg);color:var(--green);}
  .gate-status.monitor{background:var(--amber-bg);color:var(--amber);}
  .gate-status.bottleneck{background:#fbeadf;color:var(--rust);}
  .gate-status.risk{background:var(--red-bg);color:var(--red);}
  .flow-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:8px;background:var(--grey-bg);}
  .flow-seg{height:100%;}
  .flow-seg.rn{background:var(--green);} .flow-seg.rs{background:var(--amber);} .flow-seg.dv{background:var(--blue);} .flow-seg.lt{background:var(--grey);}
  .flow-legend{font-size:11px;color:var(--ink-soft);margin-bottom:12px;}
  .gate-reason{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;}
  .gate-reason textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;resize:vertical;min-height:36px;}
  .gate-hist{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .gate-hist input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;}
  .gate-opps{margin-top:8px;}
  .gate-opps .go-h{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--rust);margin-bottom:6px;}
  .go-chip{display:inline-block;background:var(--tint);color:var(--maroon);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;margin:0 6px 6px 0;}
  .go-empty{font-size:11.5px;color:#bcb9c0;font-style:italic;}

  /* ---------- Readiness (position group room) ---------- */
  .rd-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .pg-select{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--maroon);
    background:#fff;border:2px solid var(--maroon);border-radius:12px;padding:8px 16px;cursor:pointer;}
  .rh-badge{display:inline-flex;align-items:center;gap:7px;background:var(--grey-bg);border-radius:999px;
    padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border:1px solid transparent;}
  .rh-badge:hover{border-color:var(--maroon);}

  .env-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  @media(max-width:1100px){.env-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:620px){.env-grid{grid-template-columns:1fr;}}
  .env-col{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fdfdfc;}
  .env-head{background:var(--navy);color:#fff;padding:10px 12px;font-family:var(--font-display);
    font-weight:700;font-size:15px;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;}
  .env-head .cnt{background:var(--gold);color:var(--navy);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800;}
  .env-body{padding:10px;}
  .cat-block{margin-bottom:10px;}
  .cat-block:last-child{margin-bottom:0;}
  .cat-lab{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
    display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:0 2px;}
  .cat-lab::before{content:"";width:8px;height:8px;border-radius:3px;}
  .cat-lab.rn{color:var(--green);} .cat-lab.rn::before{background:var(--green);}
  .cat-lab.rs{color:var(--amber);} .cat-lab.rs::before{background:var(--amber);}
  .cat-lab.dv{color:var(--blue);} .cat-lab.dv::before{background:var(--blue);}
  .cat-lab.lt{color:var(--grey);} .cat-lab.lt::before{background:var(--grey);}
  .athlete-chip{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 9px;
    font-size:12.5px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px;cursor:pointer;
    transition:border-color .12s,box-shadow .12s;}
  .athlete-chip:hover{border-color:var(--maroon);box-shadow:0 0 0 1px var(--maroon);}
  .athlete-chip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-empty{font-size:11px;color:#bcb9c0;padding:3px 2px;font-style:italic;}

  /* ---------- Opportunities ---------- */
  .opp-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .opp-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:1000px){.opp-board{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.opp-board{grid-template-columns:1fr;}}
  .opp-col{border:1px solid var(--line);border-radius:14px;background:#fdfdfc;min-height:120px;}
  .opp-col-head{padding:10px 14px;font-family:var(--font-display);font-weight:700;font-size:14px;border-bottom:2px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;}
  .opp-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;}
  .opp-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:12.5px;}
  .opp-card .oc-type{font-weight:800;color:var(--maroon);font-size:12.5px;}
  .opp-card .oc-meta{color:var(--ink-soft);font-size:11px;margin-top:3px;}
  .opp-card .oc-note{font-size:11.5px;color:var(--ink);margin-top:6px;font-style:italic;}
  .opp-card .oc-actions{display:flex;gap:6px;margin-top:8px;}

  /* ---------- Succession (output) ---------- */
  .succ-banner{background:linear-gradient(120deg,var(--rust),#a4552a);color:#fff;border-radius:14px;padding:14px 20px;margin-bottom:16px;
    font-size:12.5px;display:flex;align-items:center;gap:10px;}
  .succ-banner b{font-family:var(--font-display);font-weight:800;letter-spacing:.4px;}
  .succ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:1000px){.succ-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.succ-grid{grid-template-columns:1fr;}}
  .succ-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fdfdfc;}
  .succ-card .sc-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--navy);margin-bottom:8px;}
  .sc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;}
  .sc-row .lab{color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .sc-row .lab::before{content:"";width:7px;height:7px;border-radius:2px;}
  .sc-row.rn .lab::before{background:var(--green);} .sc-row.rs .lab::before{background:var(--amber);}
  .sc-row.dv .lab::before{background:var(--blue);} .sc-row.lt .lab::before{background:var(--grey);}
  .sc-row .val{font-weight:800;color:var(--ink);}
  .rh-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:6px;}
  .rh-table th{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);
    text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);}
  .rh-table td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;}
  .rh-table .grp{font-weight:700;color:var(--navy);}
  .rh-flag{font-size:10.5px;font-weight:800;color:var(--red);background:var(--red-bg);border-radius:999px;padding:3px 10px;}
  .review-steps{display:flex;flex-direction:column;gap:0;}
  .rstep{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);}
  .rstep:last-child{border-bottom:none;}
  .rstep .rnum{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--rust);color:#fff;
    font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);}
  .rstep .rq{font-weight:700;font-size:14px;}
  .rstep .rd{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .cat-ref{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:820px){.cat-ref{grid-template-columns:1fr 1fr;}}
  .cr-card{border-radius:12px;padding:13px 14px;}
  .cr-card.rn{background:var(--green-bg);} .cr-card.rs{background:var(--amber-bg);}
  .cr-card.dv{background:var(--blue-bg);} .cr-card.lt{background:var(--grey-bg);}
  .cr-card .cr-t{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:4px;}
  .cr-card.rn .cr-t{color:var(--green);} .cr-card.rs .cr-t{color:var(--amber);}

/* ============ JSONBIN PERSISTENCE ============
   This is what makes the document "live" — data is saved to and loaded from
   your own JSONBin.io bin, instead of resetting every time the page reloads.

   SETUP (one-time, ~2 minutes):
   1. Create a free account at https://jsonbin.io
   2. Create a new bin — starting content can just be: {}
   3. Copy that bin's Bin ID from its URL / dashboard
   4. Go to Account -> API Keys and copy your X-MASTER-KEY
   5. Paste both into the two constants below, replacing the placeholder text
   6. Save this file and re-open it — it will now load from, and save to, that bin

   Until both are filled in, the app runs on the built-in sample data below
   and nothing is saved — safe to open and test without breaking anything.
*/
const JSONBIN_BIN_ID  = '6a8bd1cada38895dfe090e66';
const JSONBIN_API_KEY = '$2a$10$/0IxTXc47L2vv1kIX1/1DOp197DmewAtRUn.phdTZa9JonwEca072';
const JSONBIN_ENABLED = !JSONBIN_BIN_ID.startsWith('PASTE_') && !JSONBIN_API_KEY.startsWith('PASTE_');
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
let dataLoaded = false;
let saveTimer = null;

function setSyncStatus(text, color){
  const el = document.getElementById('syncStatus');
  if(el){ el.textContent = text; el.style.color = color; }
}
function collectState(){
  return { athletes, nextId, movementLog, roleHealth, gateData, opportunities, nextOppId, squadYearView, GAMES };
}
function applyState(s){
  if(!s) return;
  if(s.athletes) athletes = s.athletes;
  if(s.nextId) nextId = s.nextId;
  if(s.movementLog) movementLog = s.movementLog.map(m=>({...m, time:new Date(m.time)}));
  if(s.roleHealth) roleHealth = s.roleHealth;
  if(s.gateData) gateData = s.gateData;
  if(s.opportunities) opportunities = s.opportunities;
  if(s.nextOppId) nextOppId = s.nextOppId;
  if(s.squadYearView) squadYearView = s.squadYearView;
  if(s.GAMES) GAMES = s.GAMES;
  migrateState();
}
// Fills in any squad/program missing from data saved before it existed (e.g. Brisbane Heat).
function migrateState(){
  POSITION_GROUPS.forEach(g=>{
    if(!roleHealth[g]) roleHealth[g] = {};
    SQUADS.forEach(sq=>{ if(!roleHealth[g][sq]) roleHealth[g][sq] = 'grey'; });
  });
  SQUADS.forEach(sq=>{ if(!GAMES[sq]) GAMES[sq] = []; });
}
async function loadState(){
  if(!JSONBIN_ENABLED){
    setSyncStatus('Not connected to JSONBin — using built-in sample data', '#C98A16');
    migrateState(); dataLoaded = true; renderAll(); return;
  }
  setSyncStatus('Loading…', '#5B5B66');
  try{
    const res = await fetch(`${JSONBIN_URL}/latest`, { headers:{ 'X-Master-Key': JSONBIN_API_KEY } });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data && data.record && data.record.athletes) applyState(data.record);
    setSyncStatus('Synced with JSONBin', '#2E7D5B');
  }catch(e){
    console.error('JSONBin load failed — using built-in sample data', e);
    setSyncStatus('Could not reach JSONBin — using built-in sample data', '#C0392B');
  }
  migrateState();
  dataLoaded = true;
  renderAll();
}
function scheduleSave(){
  if(!JSONBIN_ENABLED || !dataLoaded) return;
  setSyncStatus('Saving…', '#5B5B66');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 800);
}
async function saveState(){
  try{
    const res = await fetch(JSONBIN_URL, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_API_KEY },
      body: JSON.stringify(collectState())
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    setSyncStatus('Synced with JSONBin', '#2E7D5B');
  }catch(e){
    console.error('JSONBin save failed', e);
    setSyncStatus('Save failed — check your Bin ID / API key', '#C0392B');
  }
}

// Season team sheets — genuinely dynamic. No fixed game count per program;
// add games one at a time as fixtures/teams are confirmed. Persisted via JSONBin.
let GAMES = {}; SQUADS.forEach(sq=>GAMES[sq]=[]);
let nextGameId = 1;
function blankTeam(){ return Array(12).fill(''); }
function addGame(sq){
  GAMES[sq].push({id:nextGameId++, competition:'', label:`Game ${GAMES[sq].length+1}`, opponent:'', team:blankTeam()});
  openGames(sq);
  scheduleSave();
}
function removeGame(sq, gid){
  if(!confirm('Remove this game from the team sheet record?')) return;
  GAMES[sq] = GAMES[sq].filter(g=>g.id!==gid);
  openGames(sq);
  scheduleSave();
}
function updateGameField(sq,gid,field,val){
  const g = GAMES[sq].find(x=>x.id===gid); if(!g) return;
  g[field]=val; scheduleSave();
}
function updateGameSlot(sq,gid,si,val){
  const g = GAMES[sq].find(x=>x.id===gid); if(!g) return;
  g.team[si]=val; scheduleSave();
}
function escAttr(s){ return (s||'').toString().replace(/"/g,'&quot;'); }
function openGames(sq){
  const games = GAMES[sq] || [];
  document.getElementById('modalContent').innerHTML = `
    <h3>${sq} — Team Sheets</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">Add a game each time a team is named. Saves automatically. Not linked to Readiness or squad membership.</p>
    <button class="btn sm" onclick="addGame('${sq}')" style="margin-bottom:14px;">+ Add Game</button>
    ${games.length ? games.map(g=>`
      <div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
          <input type="text" value="${escAttr(g.competition)}" placeholder="Competition (e.g. Sheffield Shield)" style="flex:1;min-width:140px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11.5px;font-weight:700;color:var(--rust);"
            onchange="updateGameField('${sq}',${g.id},'competition',this.value)">
          <input type="text" value="${escAttr(g.label)}" placeholder="Round / Game label" style="flex:1;min-width:110px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:700;color:var(--maroon);"
            onchange="updateGameField('${sq}',${g.id},'label',this.value)">
          <input type="text" value="${escAttr(g.opponent)}" placeholder="Opponent / venue" style="flex:1;min-width:140px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;"
            onchange="updateGameField('${sq}',${g.id},'opponent',this.value)">
          <button class="btn ghost sm" style="color:var(--red);border-color:var(--red);" onclick="removeGame('${sq}',${g.id})">Remove</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;">
          ${g.team.map((n,si)=>`
            <div style="display:flex;align-items:center;gap:5px;">
              <b style="font-size:11px;color:var(--rust);width:16px;flex:0 0 auto;">${si+1}</b>
              <input type="text" value="${escAttr(n)}" placeholder="Name" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;"
                onchange="updateGameSlot('${sq}',${g.id},${si},this.value)">
            </div>`).join('')}
        </div>
      </div>`).join('') : `<div class="cat-empty">No games added yet — click "+ Add Game" to start.</div>`}`;
  openModal();
}

/* ============ HELPERS ============ */
function idAthletes(){ return athletes.filter(a=>a.status==='identified'); }
function watchAthletes(){ return athletes.filter(a=>a.status==='watchlist'); }
function catsFor(pg,sq){ return CATEGORIES.map(c=>({...c, athletes: idAthletes().filter(a=>a.pg===pg && a.squad===sq && a.cat===c.key)})); }
function countFor(pg,cat){ return idAthletes().filter(a=>a.pg===pg && a.cat===cat).length; }
function readyCount(pg){ return idAthletes().filter(a=>a.pg===pg && (a.cat==='Ready Now'||a.cat==='Ready With Support')).length; }
function dotColor(v){ return v==='grey'?'#9A9AA4':v==='green'?'#2E7D5B':v==='amber'?'#C98A16':'#C0392B'; }
function healthLabel(v){ return v==='grey'?'Not yet assessed':v==='green'?'Healthy':v==='amber'?'Monitor':'Exposed'; }
function logMove(name, field, from, to){ movementLog.unshift({time:new Date(),name,field,from,to}); }
function cycleHealth(v){ return v==='grey'?'green':v==='green'?'amber':v==='amber'?'red':'grey'; }
function cycleGateStatus(v){ const order=['strong','monitor','bottleneck','risk']; return order[(order.indexOf(v)+1)%order.length]; }

/* ============ SCOREBOARD + HEADER ============ */
function renderScoreboard(){
  document.getElementById('scoreboard').innerHTML = POSITION_GROUPS.map(g=>{
    const rn = countFor(g,'Ready Now'); const rh = roleHealth[g]['Bulls'];
    return `<div class="rtile" onclick="showView('readiness');selectGroup('${g}')" style="cursor:pointer;"><div class="rt-name">${g}</div><div class="rt-row"><span class="rt-dot ${rh}"></span><span class="rt-count"><b>${rn}</b> ready now <span style="opacity:.6;">(Bulls)</span></span></div></div>`;
  }).join('');
  const total = idAthletes().length; const watching = watchAthletes().length;
  const rn = idAthletes().filter(a=>a.cat==='Ready Now').length;
  document.getElementById('headerCounts').innerHTML = `
    <div class="mchip"><div class="n">${total}</div><div class="l">Identified</div></div>
    <div class="mchip"><div class="n">${watching}</div><div class="l">Watchlist</div></div>
    <div class="mchip"><div class="n">${rn}</div><div class="l">Ready Now</div></div>`;
}

/* ============ VISIBILITY ============ */
function setVisMode(mode){
  visMode = mode;
  document.getElementById('vtIdentified').classList.toggle('active', mode==='identified');
  document.getElementById('vtWatch').classList.toggle('active', mode==='watchlist');
  document.getElementById('identifiedPane').style.display = mode==='identified' ? 'block':'none';
  document.getElementById('watchlistPane').style.display = mode==='watchlist' ? 'block':'none';
  document.getElementById('movementPanel').style.display = 'block';
}
function catCls(cat){ return CATEGORIES.find(c=>c.key===cat).cls; }
let squadYearView = {}; // per-squad selected year — 'Current' or one of HISTORICAL[sq]'s keys
function renderIdentified(){
  document.getElementById('identifiedPane').innerHTML = SQUADS.map(sq=>{
    const years = HISTORICAL[sq] ? Object.keys(HISTORICAL[sq]) : [];
    const selectedYear = squadYearView[sq] || 'Current';
    const isHistorical = selectedYear !== 'Current';
    const list = idAthletes().filter(a=>a.squad===sq);
    const yearOptions = ['Current', ...years].map(y=>`<option value="${y}" ${y===selectedYear?'selected':''}>${y}</option>`).join('');

    let bodyHtml;
    if(isHistorical){
      const names = (HISTORICAL[sq] && HISTORICAL[sq][selectedYear]) || [];
      bodyHtml = `<div class="hist-note" style="margin-top:8px;">Past squad — reference only, not editable.</div>
        <div class="hist-list">${names.map(n=>`<div class="hist-row">${n}</div>`).join('')}</div>`;
    } else {
      bodyHtml = `
        ${list.length? list.map(a=>`
          <div class="id-row" onclick="editAthlete(${a.id})">
            <span class="nm">${a.name}</span><span class="tag">${a.pg}</span><span class="club">${a.club||''}</span>
            <span class="cat-badge ${catCls(a.cat)}">${a.cat}</span>
          </div>`).join('') : `<div class="cat-empty">No athletes currently in this squad.</div>`}
        <div class="add-form">
          <input type="text" placeholder="Add athlete name…" id="add-${sq.replace(/\s/g,'')}">
          <select id="addpg-${sq.replace(/\s/g,'')}">${POSITION_GROUPS.map(g=>`<option>${g}</option>`).join('')}</select>
          <button class="btn sm" onclick="quickAddIdentified('${sq}')">Add</button>
        </div>`;
    }

    return `<div class="squad-col"><div class="squad-head">
        <span>${sq}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="cnt">${isHistorical ? (HISTORICAL[sq][selectedYear]||[]).length : list.length}</span>
          ${years.length ? `<select style="font-size:11px;border-radius:6px;border:none;padding:2px 6px;font-weight:700;" onchange="squadYearView['${sq}']=this.value;renderIdentified()">${yearOptions}</select>` : ''}
          <span style="font-size:11px;color:var(--gold);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;" onclick="openGames('${sq}')">🏏 Games${GAMES[sq] && GAMES[sq].length ? ` (${GAMES[sq].length})` : ''}</span>
        </span>
      </div>
      <div class="squad-body">${bodyHtml}</div></div>`;
  }).join('');
}
function quickAddIdentified(sq){
  const key = sq.replace(/\s/g,'');
  const nameEl = document.getElementById('add-'+key), pgEl = document.getElementById('addpg-'+key);
  const name = nameEl.value.trim(); if(!name) return;
  athletes.push({id:nextId++, name, pg:pgEl.value, club:'', status:'identified', squad:sq, cat:'Developing'});
  logMove(name,'Added','—',`${sq} · ${pgEl.value} · Developing`);
  nameEl.value=''; renderAll();
}
function renderWatchlist(){
  const watchRow = a => `
        <div class="watch-row">
          <span class="nm">${a.name}</span>
          <span class="tag">${a.pg}${a.club?' · '+a.club:''}</span>
          <span class="note">${a.watchNote||'No note yet.'}</span>
          <span class="wc-actions">
            <button class="btn sm" onclick="promoteAthlete(${a.id})">Move to Identified Squad</button>
            <button class="btn ghost sm" onclick="removeAthlete(${a.id})">Remove</button>
          </span>
        </div>`;

  const sections = SQUADS.map(sq=>{
    const list = watchAthletes().filter(a=>a.watchProgram===sq);
    return `<div class="squad-col">
      <div class="squad-head"><span>${sq} Watchlist</span><span class="cnt">${list.length}</span></div>
      <div class="squad-body">
        <div class="watch-list">
          ${list.length ? list.map(watchRow).join('') : `<div class="cat-empty" style="padding:10px 4px;">No athletes currently being monitored for ${sq}.</div>`}
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('watchlistPane').innerHTML = `
    ${sections}
    <div class="add-form" style="margin-top:4px;">
      <input type="text" placeholder="Name…" id="watchName">
      <select id="watchPg">${POSITION_GROUPS.map(g=>`<option>${g}</option>`).join('')}</select>
      <select id="watchProgram">${SQUADS.map(sq=>`<option>${sq}</option>`).join('')}</select>
      <input type="text" placeholder="Why we're watching…" id="watchNote" style="flex:2;">
      <button class="btn sm" onclick="addWatch()">Add to Watchlist</button>
    </div>`;
}
function addWatch(){
  const name = document.getElementById('watchName').value.trim(); if(!name) return;
  const pg = document.getElementById('watchPg').value;
  const program = document.getElementById('watchProgram').value;
  const note = document.getElementById('watchNote').value.trim();
  athletes.push({id:nextId++, name, pg, club:'', status:'watchlist', watchProgram:program, watchNote:note});
  logMove(name,'Added to Watchlist','—',`${program} · ${pg}`);
  document.getElementById('watchName').value=''; document.getElementById('watchNote').value='';
  renderAll();
}
function promoteAthlete(id){
  const a = athletes.find(x=>x.id===id); if(!a) return;
  document.getElementById('modalContent').innerHTML = `
    <h3>Move ${a.name} to an Identified Squad</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">This is the Identify step — the only way an athlete moves from Watchlist into the readiness system.</p>
    <div class="mfield"><label>Squad</label><select id="promoteSquad">${SQUADS.map(s=>`<option ${s===a.watchProgram?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="mfield"><label>Readiness Category</label><select id="promoteCat">${CATEGORIES.map(c=>`<option>${c.key}</option>`).join('')}</select></div>
    <button class="btn" onclick="confirmPromote(${id})">Confirm</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button>`;
  openModal();
}
function confirmPromote(id){
  const a = athletes.find(x=>x.id===id);
  const sq = document.getElementById('promoteSquad').value, cat = document.getElementById('promoteCat').value;
  a.status='identified'; a.squad=sq; a.cat=cat; delete a.watchNote; delete a.watchProgram;
  logMove(a.name,'Identified','Watchlist',`${sq} · ${cat}`);
  closeModal(); renderAll();
}
function removeAthlete(id){
  const a = athletes.find(x=>x.id===id); if(!a) return;
  if(!confirm(`Remove ${a.name} from the system?`)) return;
  athletes = athletes.filter(x=>x.id!==id);
  logMove(a.name,'Removed', a.status==='identified'?`${a.pg} · ${a.squad} · ${a.cat}`:'Watchlist','—');
  closeModal();
  renderAll();
}
function editAthlete(id){
  const a = athletes.find(x=>x.id===id); if(!a) return;
  document.getElementById('modalContent').innerHTML = `
    <h3>${a.name}</h3>
    <div class="mfield"><label>Position Group</label><select id="editPg">${POSITION_GROUPS.map(g=>`<option ${g===a.pg?'selected':''}>${g}</option>`).join('')}</select></div>
    <div class="mfield"><label>Squad</label><select id="editSquad">${SQUADS.map(s=>`<option ${s===a.squad?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="mfield"><label>Club / Region</label><input id="editClub" value="${a.club||''}"></div>
    <div class="mfield"><label>Readiness Category</label><select id="editCat">${CATEGORIES.map(c=>`<option ${c.key===a.cat?'selected':''}>${c.key}</option>`).join('')}</select>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;" id="editCatQ"></div></div>
    <button class="btn" onclick="saveAthlete(${a.id})">Save Changes</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn ghost" onclick="openMoveToWatchlist(${a.id})">Move To Watchlist</button>
    <button class="btn ghost" style="color:var(--red);border-color:var(--red);float:right;" onclick="removeAthlete(${a.id});">Remove</button>`;
  const upd = ()=>{ document.getElementById('editCatQ').textContent = CATEGORY_Q[document.getElementById('editCat').value]; };
  document.getElementById('editCat').addEventListener('change', upd); upd();
  openModal();
}
function openMoveToWatchlist(id){
  const a = athletes.find(x=>x.id===id); if(!a) return;
  document.getElementById('modalContent').innerHTML = `
    <h3>Move ${a.name} to Watchlist</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">${a.name} will leave ${a.squad} immediately and appear in the Watchlist tab under the program selected below.</p>
    <div class="mfield"><label>Watchlist Program</label><select id="moveWatchProgram">${SQUADS.map(sq=>`<option ${sq===a.squad?'selected':''}>${sq}</option>`).join('')}</select></div>
    <div class="mfield"><label>Reason</label><textarea id="moveWatchReason" rows="2" placeholder="Why is this athlete moving to the Watchlist?"></textarea></div>
    <button class="btn" onclick="confirmMoveToWatchlist(${id})">Confirm</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button>`;
  openModal();
}
function confirmMoveToWatchlist(id){
  const a = athletes.find(x=>x.id===id); if(!a) return;
  const program = document.getElementById('moveWatchProgram').value;
  const reason = document.getElementById('moveWatchReason').value.trim();
  const fromDetail = `${a.pg} · ${a.squad} · ${a.cat}`;
  a.status = 'watchlist';
  a.watchProgram = program;
  a.watchNote = reason;
  delete a.squad;
  delete a.cat;
  logMove(a.name, 'Moved to Watchlist', fromDetail, `${program} Watchlist`);
  closeModal(); renderAll();
}
function saveAthlete(id){
  const a = athletes.find(x=>x.id===id);
  const newPg=document.getElementById('editPg').value, newSq=document.getElementById('editSquad').value,
        newClub=document.getElementById('editClub').value, newCat=document.getElementById('editCat').value;
  if(newSq!==a.squad) logMove(a.name,'Squad',a.squad,newSq);
  if(newCat!==a.cat) logMove(a.name,'Readiness',a.cat,newCat);
  if(newPg!==a.pg) logMove(a.name,'Position Group',a.pg,newPg);
  a.pg=newPg; a.squad=newSq; a.club=newClub; a.cat=newCat;
  closeModal(); renderAll();
}
function toggleMovementPanel(){
  const feed = document.getElementById('mvFeed');
  const icon = document.getElementById('mvToggleIcon');
  const isHidden = feed.style.display === 'none';
  feed.style.display = isHidden ? 'block' : 'none';
  icon.textContent = isHidden ? '▾ Hide' : '▸ Show';
}
function renderMovementPanel(){
  document.getElementById('mvSub').textContent = `${movementLog.length} change${movementLog.length===1?'':'s'} logged`;
  const el = document.getElementById('mvFeed');
  if(!movementLog.length){ el.innerHTML = `<div class="empty-state">No movement logged yet.</div>`; return; }
  el.innerHTML = movementLog.map(m=>`
    <div class="mv-row"><div class="mv-time">${m.time.toLocaleDateString([], {month:'short',day:'numeric'})} ${m.time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
      <div class="mv-name">${m.name}</div><div class="mv-detail">${m.field}: <span class="from">${m.from}</span> → <span class="to">${m.to}</span></div></div>`).join('');
}

/* ============ READINESS ============ */
function selectGroup(g){ currentGroup=g; document.getElementById('pgSelect').value=g; renderReadiness(); }
function renderReadiness(){
  const sel = document.getElementById('pgSelect');
  if(!sel.options.length) sel.innerHTML = POSITION_GROUPS.map(g=>`<option value="${g}">${g}</option>`).join('');
  sel.value = currentGroup;

  document.getElementById('envGrid').innerHTML = SQUADS.map(sq=>{
    const groups = catsFor(currentGroup, sq); const total = groups.reduce((s,c)=>s+c.athletes.length,0);
    const status = roleHealth[currentGroup][sq];
    return `<div class="env-col"><div class="env-head"><span>${sq}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="cnt">${total}</span>
          <span class="rt-dot" title="${healthLabel(status)} — click to change" style="background:${dotColor(status)};cursor:pointer;" onclick="toggleHealth('${currentGroup}','${sq}')"></span>
        </span></div>
      <div class="env-body">
        ${groups.map(c=>`<div class="cat-block"><div class="cat-lab ${c.cls}">${c.key}</div>
          ${c.athletes.length? c.athletes.map(a=>`<div class="athlete-chip" onclick="editAthlete(${a.id})"><span class="nm">${a.name}</span></div>`).join('') : `<div class="cat-empty">—</div>`}
        </div>`).join('')}
      </div></div>`;
  }).join('');
}
function openProfile(){
  const p = PROFILES[currentGroup];
  document.getElementById('modalContent').innerHTML = `<h3>${currentGroup} — Readiness Profile</h3>
    ${p.draft?'<div class="draft-tag">Draft — not yet reviewed</div>':''}
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">Reference guide, not a scoring tool.</p>
    ${Object.entries(p.groups).map(([label,items])=>`<div class="prof-group"><div class="pg-h">${label}</div><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}`;
  openModal();
}
function toggleHealth(g, sq){ if(!g) return; roleHealth[g][sq]=cycleHealth(roleHealth[g][sq]); renderAll(); }

/* ============ SUCCESSION (OUTPUT) ============ */
function renderSuccession(){
  document.getElementById('rhBody').innerHTML = POSITION_GROUPS.map(g=>{
    const flag = readyCount(g)===0;
    const cells = SQUADS.map(sq=>{
      const st = roleHealth[g][sq];
      return `<td><span class="rt-dot" style="background:${dotColor(st)};display:inline-block;margin-right:6px;"></span>${healthLabel(st)}</td>`;
    }).join('');
    return `<tr><td class="grp" style="cursor:pointer;text-decoration:underline;text-underline-offset:2px;" onclick="showView('readiness');selectGroup('${g}')">${g}</td>
      ${cells}
      <td>${flag?'<span class="rh-flag">No clear successor</span>':''}</td></tr>`;
  }).join('');
}

/* ============ TABS / MODAL ============ */
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelector(`.tab[data-view="${name}"]`).classList.add('active');
}
document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(b) showView(b.dataset.view); });
document.getElementById('pgSelect').addEventListener('change', e=>{ currentGroup=e.target.value; renderReadiness(); });
document.getElementById('viewProfileBtn').addEventListener('click', openProfile);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
function openModal(){ document.getElementById('modalBg').classList.add('active'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }

/* ============ RENDER ALL ============ */
function renderAll(){
  renderScoreboard();
  renderIdentified(); renderWatchlist(); renderMovementPanel();
  renderReadiness();
  renderSuccession();
  scheduleSave();
}
loadState();
</script>
</body>
</html>
